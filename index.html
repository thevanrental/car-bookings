<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary SEO -->
    <title>Car Bookings — Local & Independent Car Rentals</title>
    <meta name="description" content="Compare independent local car rental companies with no hidden counter fees. Transparent pricing with taxes included upfront. Available in Los Angeles, Orange County, Cancún, Playa del Carmen and Tulum." />
    <meta name="keywords" content="car rental, independent car rental, local car hire, no hidden fees, transparent pricing, Los Angeles car rental, Cancun car rental" />
    <meta name="author" content="Car Bookings" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.car-bookings.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.car-bookings.com/" />
    <meta property="og:title" content="Car Bookings — Local & Independent Car Rentals" />
    <meta property="og:description" content="Compare independent local car rental companies with no hidden counter fees. Transparent pricing with taxes included upfront." />
    <meta property="og:image" content="https://raw.githubusercontent.com/thevanrental/thevantental/main/images/glcb.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Car Bookings" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:locale:alternate" content="uk_UA" />
    <meta property="og:locale:alternate" content="fr_FR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@carbookings" />
    <meta name="twitter:title" content="Car Bookings — Local & Independent Car Rentals" />
    <meta name="twitter:description" content="Compare independent local car rental companies with no hidden counter fees. Transparent pricing with taxes included upfront." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/thevanrental/thevantental/main/images/glcb.jpeg" />

    <!-- hreflang for multilingual -->
    <link rel="alternate" hreflang="en" href="https://www.car-bookings.com/" />
    <link rel="alternate" hreflang="es" href="https://www.car-bookings.com/?lang=es" />
    <link rel="alternate" hreflang="ru" href="https://www.car-bookings.com/?lang=ru" />
    <link rel="alternate" hreflang="uk" href="https://www.car-bookings.com/?lang=uk" />
    <link rel="alternate" hreflang="fr" href="https://www.car-bookings.com/?lang=fr" />
    <link rel="alternate" hreflang="x-default" href="https://www.car-bookings.com/" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Car Bookings",
      "url": "https://www.car-bookings.com",
      "description": "Compare independent local car rental companies with no hidden counter fees.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.car-bookings.com/#cars",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: Cormorant for display headings + Inter for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
